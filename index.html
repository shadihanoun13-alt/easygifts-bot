<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EasyGifts</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #2b124c 0%, #110726 100%);
      color: #fff;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 80px;
    }

    /* Верхняя панель */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .balance-badge {
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid rgba(255, 183, 3, 0.4);
      color: #ffb703;
      border-radius: 20px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Заголовок */
    .title-box {
      margin-bottom: 20px;
    }

    .title-box h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .title-box p {
      font-size: 13px;
      color: #9d8ec2;
      margin-top: 4px;
    }

    /* Сетка кейсов в стиле Virus Game */
    .cases-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .case-card {
      background: linear-gradient(180deg, rgba(82, 38, 142, 0.6) 0%, rgba(35, 15, 66, 0.8) 100%);
      border: 1px solid rgba(162, 116, 245, 0.3);
      border-radius: 20px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease;
    }

    .case-card:active {
      transform: scale(0.97);
    }

    .case-card img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 12px;
      filter: drop-shadow(0 6px 16px rgba(120, 60, 255, 0.4));
    }

    .case-name {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
    }

    .case-price-btn {
      width: 100%;
      background: linear-gradient(90deg, #ff9e00 0%, #e85d04 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 12px rgba(232, 93, 4, 0.35);
      cursor: pointer;
    }

    /* Модалка открытия */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      width: 100%;
      max-width: 320px;
      background: #1e0d38;
      border: 1px solid #7b2cbf;
      border-radius: 24px;
      padding: 24px 16px;
      text-align: center;
    }

    .roulette-track {
      width: 100%;
      height: 120px;
      background: rgba(0,0,0,0.4);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin: 16px 0;
      position: relative;
    }

    .action-btn {
      width: 100%;
      background: #7b2cbf;
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 12px 0;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="badge">EASYGIFTS 🎁</div>
    <div class="balance-badge">
      <span id="balance">0</span> ⭐️
    </div>
  </div>

  <div class="title-box">
    <h1>Кейсы с Telegram NFT</h1>
    <p>Открывай и выбивай подарки прямо в профиль</p>
  </div>

  <div class="cases-grid">
    <!-- Кейс 1 -->
    <div class="case-card" onclick="openCaseModal('Кейс Новичка', 25)">
      <img src="https://cdn-icons-png.flaticon.com/512/3209/3209955.png" alt="Box">
      <div class="case-name">Новичок</div>
      <button class="case-price-btn">25 ⭐️</button>
    </div>

    <!-- Кейс 2 -->
    <div class="case-card" onclick="openCaseModal('Кейс Telegram NFT', 75)">
      <img src="https://cdn-icons-png.flaticon.com/512/9420/9420514.png" alt="NFT Box">
      <div class="case-name">NFT Drop</div>
      <button class="case-price-btn">75 ⭐️</button>
    </div>

    <!-- Кейс 3 -->
    <div class="case-card" onclick="openCaseModal('Королевский Кейс', 250)">
      <img src="https://cdn-icons-png.flaticon.com/512/10043/10043869.png" alt="Gold Box">
      <div class="case-name">Королевский</div>
      <button class="case-price-btn">250 ⭐️</button>
    </div>

    <!-- Кейс 4 -->
    <div class="case-card" onclick="openCaseModal('Pepe Jackpot', 500)">
      <img src="https://cdn-icons-png.flaticon.com/512/3132/3132693.png" alt="Jackpot">
      <div class="case-name">Pepe Jackpot</div>
      <button class="case-price-btn">500 ⭐️</button>
    </div>
  </div>

  <!-- Модальное окно открытия -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <h2 id="modal-title" style="font-size: 18px;">Открытие кейса</h2>
      <div class="roulette-track" id="anim-box">🎁</div>
      <div id="result-text" style="color: #9d8ec2; font-size: 14px; min-height: 20px;"></div>
      <button class="action-btn" id="spin-btn" onclick="startSpin()">Крутить!</button>
      <button class="action-btn" style="background: transparent; color: #777; margin-top: 4px;" onclick="closeModal()">Закрыть</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand(); // Разворачиваем на весь экран
      tg.ready();
    }

    let currentCost = 0;
    const prizes = [
      { name: "🧸 Teddy Bear", icon: "🧸" },
      { name: "💖 Heart Box", icon: "💖" },
      { name: "🏆 Golden Cup", icon: "🏆" },
      { name: "💎 Unique NFT", icon: "💎" }
    ];

    function openCaseModal(title, cost) {
      currentCost = cost;
      document.getElementById('modal-title').innerText = title + ` (${cost} ⭐️)`;
      document.getElementById('result-text').innerText = "Нажми кнопку, чтобы открыть";
      document.getElementById('spin-btn').style.display = 'block';
      document.getElementById('modal').style.display = 'flex';
      document.getElementById('anim-box').innerText = "🎁";
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    function startSpin() {
      const animBox = document.getElementById('anim-box');
      const resText = document.getElementById('result-text');
      const btn = document.getElementById('spin-btn');
      
      btn.style.display = 'none';
      resText.innerText = "Крутим барабан...";

      let counter = 0;
      const interval = setInterval(() => {
        const rand = prizes[Math.floor(Math.random() * prizes.length)];
        animBox.innerText = rand.icon;
        counter++;
        if (counter > 15) {
          clearInterval(interval);
          const finalDrop = prizes[Math.floor(Math.random() * prizes.length)];
          animBox.innerText = finalDrop.icon;
          resText.innerHTML = `<b style="color: #00f0ff;">Выпало: ${finalDrop.name}!</b>`;
          
          if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
          }
        }
      }, 100);
    }
  </script>
</body>
</html>
